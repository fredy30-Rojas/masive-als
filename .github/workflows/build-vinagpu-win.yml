name: Build Vina-GPU-2.1 Windows

on:
  push:
    paths:
      - '.github/workflows/build-vinagpu-win.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Preparar MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            make
            git
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-opencl-icd
            mingw-w64-x86_64-opencl-headers

      - name: Clonar Vina-GPU-2.1
        run: |
          git clone --depth 1 https://github.com/DeltaGroupNJUPT/Vina-GPU-2.1.git
          echo "clonado OK"

      - name: Parchear compatibilidad Boost 1.9x
        run: |
          cd Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          sed -i 's|#include <boost/filesystem/convenience.hpp>|#include <boost/filesystem.hpp>|' main/main.cpp
          grep -n "boost/filesystem" main/main.cpp

      - name: Listar librerias Boost
        run: |
          ls /mingw64/lib/libboost_program_options* /mingw64/lib/libboost_filesystem* /mingw64/lib/libboost_thread* /mingw64/lib/libboost_system* 2>&1 | head -20

      - name: Escribir Makefile y compilar
        run: |
          cd Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          printf '%s\n' \
            'WORK_DIR=$(shell pwd)' \
            'BOOST_LIB_PATH=/mingw64' \
            'OPENCL_VERSION=-DOPENCL_3_0' \
            'GPU_PLATFORM=-DNVIDIA_PLATFORM' \
            'DOCKING_BOX_SIZE=-DSMALL_BOX' \
            'BOOST_INC_PATH=-I$(BOOST_LIB_PATH)/include' \
            'VINA_GPU_INC_PATH=-I$(WORK_DIR)/lib -I$(WORK_DIR)/OpenCL/inc' \
            'OPENCL_INC_PATH=-I/mingw64/include' \
            'LIB1=-lboost_program_options-mt -lboost_system-mt -lboost_filesystem-mt -lboost_thread-mt -lOpenCL' \
            'LIB2=-lstdc++' \
            'LIB3=-lm -lpthread' \
            'LIB_PATH=-L/mingw64/lib' \
            'SRC=./lib/*.cpp ./OpenCL/src/wrapcl.cpp' \
            'MACRO=$(OPENCL_VERSION) $(GPU_PLATFORM) $(DOCKING_BOX_SIZE) -DWINDOWS -DBOOST_TIMER_ENABLE_DEPRECATED' \
            'all:' \
            '	g++ -o Vina-GPU-2.1-win.exe $(BOOST_INC_PATH) $(VINA_GPU_INC_PATH) $(OPENCL_INC_PATH) ./main/main.cpp -O3 $(SRC) $(LIB1) $(LIB2) $(LIB3) $(LIB_PATH) $(MACRO) -DNDEBUG' \
            > Makefile
          echo "=== Makefile ==="
          cat Makefile
          echo "=== compilando ==="
          make 2>&1 | tail -50
          echo "=== resultado ==="
          ls -la Vina-GPU-2.1-win.exe 2>&1 || echo "NO SE GENERO EL EXE"

      - name: Subir exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vinagpu-win
          path: Vina-GPU-2.1/AutoDock-Vina-GPU-2.1/Vina-GPU-2.1-win.exe
          if-no-files-found: warn
