# ============================================================
# Portal principal — raíz del servidor
# ============================================================
server {
    listen 80;
    server_name _;

    root /var/www/portal;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Sub-sitio: MASIVE-ALS
    location /masive-als/ {
        alias /var/www/masive-als/;
        index index.html;
    }

    # Sub-sitio: Accesibilidad (conmimirada)
    location /accesibilidad/ {
        alias /var/www/accesibilidad/;
        index index.html;
    }
}

# ============================================================
# conmimirada.is-a.dev → página de accesibilidad
# ============================================================
server {
    listen 80;
    server_name conmimirada.is-a.dev;

    root /var/www/accesibilidad;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ============================================================
# masive-als.is-a.dev → proyecto MASIVE-ALS
# ============================================================
server {
    listen 80;
    server_name masive-als.is-a.dev;

    root /var/www/masive-als;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
